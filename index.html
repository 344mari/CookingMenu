<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>冷蔵庫の献立</title>
<style>
  :root {
    --bg: #fdf7ef;
    --surface: #ffffff;
    --text: #23211d;
    --muted: #6b665c;
    --border: #e2ddd2;
    --accent: #a65a3a;
    --accent-text: #ffffff;
    --chip: #f5ede1;
    --chip-on: #a65a3a;
    --danger: #c62828;
    --danger-bg: #fdecea;
    --ok-bg: #f6e6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18150f;
      --surface: #24201b;
      --text: #ede6dc;
      --muted: #a89d90;
      --border: #3d362e;
      --accent: #e0946f;
      --accent-text: #2a170e;
      --chip: #312b24;
      --chip-on: #e0946f;
      --danger: #ff6b6b;
      --danger-bg: #3a1f1f;
      --ok-bg: #3a2b20;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 600px; margin: 0 auto; padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); }
  .screen[hidden] { display: none; }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav a {
    flex: 1; max-width: 300px; text-align: center; font-size: .8rem;
    padding: 6px 0 8px; color: var(--muted); text-decoration: none; font-weight: 700;
    border-top: 3px solid transparent; margin-top: -1px;
  }
  .bottom-nav a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
  .bottom-nav .badge { background: var(--danger); color: #fff; }
  .nav-icon { display: block; font-size: 1.5rem; line-height: 1.3; }
  .bottom-nav a:not([aria-current]) .nav-icon { filter: grayscale(.6); opacity: .7; }
  h1 { font-size: 1.35rem; margin: 4px 0 16px; text-align: center; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(120, 90, 50, .06);
  }
  .finder { display: grid; grid-template-columns: 1fr minmax(0, 42%); gap: 8px; margin-bottom: 12px; }
  .finder input[type="search"] { margin-bottom: 0; min-width: 0; }
  .finder select { width: 100%; min-width: 0; }
  .finder select.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .badge {
    display: inline-block; min-width: 1.4em; margin-left: 4px; padding: 0 5px;
    border-radius: 999px; background: var(--accent); color: var(--accent-text);
    font-size: .75rem; font-weight: 700; line-height: 1.4em; text-align: center;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: .95rem;
    cursor: pointer;
    min-height: 40px;
  }
  .chip[aria-pressed="true"] {
    background: var(--chip-on);
    border-color: var(--chip-on);
    color: var(--accent-text);
    font-weight: 600;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label.field { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 4px; }
  input[type="date"], input[type="search"], input[type="number"], select {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    min-height: 44px;
  }
  /* iOS Safari の日付欄は既定の最小幅で枠からはみ出すので、見た目をリセットして幅に収める */
  input[type="date"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; min-width: 0; max-width: 100%; text-align: left;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input[type="search"] { width: 100%; margin-bottom: 8px; }
  button.primary {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    min-height: 44px;
    cursor: pointer;
  }
  button.primary.wide { width: 100%; margin-top: 16px; font-size: 1.05rem; }
  button.link {
    font: inherit; font-size: .85rem;
    background: none; border: none; color: var(--muted);
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  .selected-note { font-size: .85rem; color: var(--muted); margin-top: 10px; min-height: 1.5em; }
  ul.picked { list-style: none; margin: 4px 0 0; padding: 0; }
  ul.picked li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  ul.picked .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  /* 購入日・賞味期限を横に2つ、残りの量はその下に全幅で並べる */
  .fields {
    flex-basis: 100%; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    color: var(--text); font-weight: 400;
  }
  .fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fld.full { grid-column: 1 / -1; }
  .flabel { font-size: .8rem; color: var(--muted); }
  .amount { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .amount select { min-height: 40px; padding: 6px 8px; }
  .amt-count { display: inline-flex; gap: 4px; align-items: center; }
  .amt-count[hidden] { display: none; }
  .amt-n { width: 3.2em; min-height: 40px; padding: 6px 4px; text-align: center; }
  .step {
    font: inherit; font-size: 1.1rem; width: 40px; height: 40px; cursor: pointer;
    background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  }
  ul.stock { list-style: none; margin: 0; padding: 0; }
  ul.stock li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  ul.stock li.urgent { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 600; }
  ul.stock li { flex-wrap: wrap; }
  ul.stock .item-btn {
    flex: 1; min-width: 0; overflow-wrap: anywhere; text-align: left;
    font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer;
  }
  .amt-label { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); }
  .amt-label.empty-count { color: var(--danger); font-weight: 600; }
  .kind {
    display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px;
    background: var(--chip); color: var(--muted); font-size: .75rem; font-weight: 600; vertical-align: 2px;
  }
  .exp-btn {
    font: inherit; font-size: .85rem; text-align: right; color: inherit;
    background: none; border: 1px dashed transparent; border-radius: 8px;
    padding: 2px 6px; min-height: 40px; cursor: pointer; white-space: nowrap;
  }
  .exp-btn::after { content: " ✎"; opacity: .6; }
  ul.stock li:not(.urgent) .exp-btn { color: var(--muted); }
  ul.stock .edit-panel { flex-basis: 100%; padding-top: 8px; border-top: 1px dashed var(--border); }
  ul.stock .edit-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .chip.product-add { border-style: dashed; background: none; }
  .del {
    font: inherit; background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem;
  }
  .empty { color: var(--muted); font-size: .9rem; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 select { width: 100%; }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
  }
  .card h4 { margin: 0; font-size: 1.1rem; }
  .meta { font-size: .85rem; color: var(--muted); margin: 2px 0 10px; }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .label { font-size: .8rem; color: var(--muted); margin: 8px 0 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: var(--ok-bg); }
  .tag.urgent { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
  .tag.missing { background: var(--chip); color: var(--muted); }
  .recipe-link {
    display: inline-block; margin-top: 12px;
    color: var(--accent); font-weight: 700; text-decoration: none;
    border: 1px solid var(--accent); border-radius: 10px; padding: 8px 14px;
  }
  .notice { font-size: .9rem; color: var(--muted); margin: 12px 0 0; }
  .notice a { color: var(--accent); font-weight: 700; }
  .error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>🧊 冷蔵庫の献立 🍳</h1>

  <div class="screen" id="screen-stock">
    <section aria-labelledby="add-h">
      <h2 id="add-h">🛒 食材を登録</h2>
      <div class="finder">
        <input type="search" id="cat-search" placeholder="食材名・既製品名" aria-label="食材名で検索、または既製品名を入力" autocomplete="off" enterkeyhint="search">
        <select id="cat-select" aria-label="カテゴリから選ぶ"></select>
      </div>
      <div id="catalog"></div>
      <p class="selected-note" id="selected-note"></p>
      <ul class="picked" id="picked"></ul>
      <button class="primary wide" id="add-btn" hidden>在庫に追加</button>
    </section>

    <section aria-labelledby="stock-h">
      <div class="row" style="justify-content: space-between;">
        <h2 id="stock-h" style="margin:0">🧺 在庫 <span id="stock-count"></span></h2>
        <button class="link" id="clear-btn" hidden>すべて削除</button>
      </div>
      <div style="margin-top:12px"><ul class="stock" id="stock-list"></ul></div>
    </section>
  </div>

  <div class="screen" id="screen-menu" hidden>
    <section aria-labelledby="suggest-h">
      <h2 id="suggest-h">🍽️ 献立を提案</h2>
      <p class="notice" id="stock-summary" style="margin:0 0 4px"></p>
      <div class="grid2">
        <div>
          <label class="field" for="time">⏱️ 調理時間</label>
          <select id="time">
            <option value="15">15分以内</option>
            <option value="30" selected>30分以内</option>
            <option value="60">60分以内</option>
            <option value="0">指定なし</option>
          </select>
        </div>
        <div>
          <label class="field" for="mood">💭 気分</label>
          <select id="mood">
            <option value="">🎲 なんでも</option>
            <option value="和食">🍙 和食</option>
            <option value="洋食">🍝 洋食</option>
            <option value="中華">🥟 中華</option>
            <option value="エスニック">🌶️ エスニック</option>
          </select>
        </div>
      </div>
      <button class="primary wide" id="suggest-btn">献立を提案</button>
      <div id="results" aria-live="polite"></div>
    </section>
  </div>
</main>

<nav class="bottom-nav" aria-label="画面の切り替え">
  <a href="#stock" id="nav-stock"><span class="nav-icon" aria-hidden="true">🧊</span>在庫管理</a>
  <a href="#menu" id="nav-menu"><span class="nav-icon" aria-hidden="true">🍳</span>献立</a>
</nav>

<script>
(() => {
  'use strict';

  // よく使う食材リスト。recipes.json の ingredients はこの表記に合わせる
  const CATALOG = {
    '野菜・きのこ': ['玉ねぎ', 'にんじん', 'じゃがいも', 'キャベツ', '白菜', '大根', 'ねぎ', 'ピーマン', 'なす', 'トマト', 'きゅうり', 'ほうれん草', 'ブロッコリー', 'もやし', 'レタス', 'かぼちゃ', 'しめじ', 'えのき', 'ごぼう', 'にら'],
    '肉': ['豚肉', '鶏もも肉', '鶏むね肉', '牛肉', 'ひき肉', 'ベーコン', 'ハム', 'ウインナー'],
    '魚介': ['鮭', 'さば', 'ぶり', 'えび', 'いか', 'ツナ缶'],
    '卵・乳製品・大豆': ['卵', '牛乳', 'チーズ', 'バター', '豆腐', '油揚げ', '納豆'],
    'フルーツ': ['りんご', 'バナナ', 'みかん', 'オレンジ', 'グレープフルーツ', 'レモン', 'いちご', 'ぶどう', 'キウイ', 'もも', 'なし', '柿', 'パイナップル', 'メロン', 'すいか', 'ブルーベリー', 'アボカド'],
    '主食・その他': ['ごはん', 'うどん', 'パスタ', '中華麺', 'カレールウ', 'キムチ', 'こんにゃく'],
  };
  // 漢字を含む食材のよみ。ひらがなで入力しても検索で見つかるようにする
  const READINGS = {
    '玉ねぎ': 'たまねぎ', '白菜': 'はくさい', '大根': 'だいこん', 'ほうれん草': 'ほうれんそう',
    '豚肉': 'ぶたにく', '鶏もも肉': 'とりももにく', '鶏むね肉': 'とりむねにく', '牛肉': 'ぎゅうにく', 'ひき肉': 'ひきにく',
    '鮭': 'さけ しゃけ', 'ツナ缶': 'つなかん',
    '卵': 'たまご', '牛乳': 'ぎゅうにゅう', '豆腐': 'とうふ', '油揚げ': 'あぶらあげ', '納豆': 'なっとう',
    '中華麺': 'ちゅうかめん', '柿': 'かき',
  };
  // 見た目用の絵文字（カテゴリと料理のタイプ）
  const CAT_EMOJI = {
    '野菜・きのこ': '🥬', '肉': '🍖', '魚介': '🐟', '卵・乳製品・大豆': '🥚', 'フルーツ': '🍎', '主食・その他': '🍚',
  };
  const TYPE_EMOJI = { '和食': '🍙', '洋食': '🍝', '中華': '🥟', 'エスニック': '🌶️' };
  const STORAGE_KEY = 'cookingMenu.stock';
  const URGENT_DAYS = 3;
  const RESULT_COUNT = 3;

  const $ = (id) => document.getElementById(id);
  const selected = new Map(); // 選択中の名前 → { bought・expiry: 'YYYY-MM-DD' か ''（購入日は今日が初期値）、amount: 残りの量、product: 既製品なら true }
  let activeCat = null; // 開いているカテゴリ。null なら食材は並べない
  let stock = loadStock();
  let editingId = null; // 在庫一覧で賞味期限を編集中の行
  let recipes = null;
  let recipesError = null;

  // ---------- 保存 ----------
  function loadStock() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(data) ? data.filter((s) => s && typeof s.name === 'string') : [];
    } catch (e) {
      return [];
    }
  }
  function saveStock() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stock));
    } catch (e) {
      alert('データを保存できませんでした（プライベートブラウズ等では保存されません）');
    }
  }

  // ---------- 日付 ----------
  function today() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // 期限までの日数（今日=0、過ぎたら負）。期限なしは null
  function daysLeft(expiry) {
    if (!expiry) return null;
    const [y, m, d] = expiry.split('-').map(Number);
    return Math.round((new Date(y, m - 1, d) - today()) / 86400000);
  }
  function toYmd(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function shortDate(ymd) {
    return ymd.slice(5).replace('-', '/');
  }
  // 購入日から何日たったか（今日=0）。購入日なしは null
  function daysSince(bought) {
    const d = daysLeft(bought);
    return d === null ? null : -d;
  }
  function boughtLabel(days) {
    if (days === 0) return '今日購入';
    if (days === 1) return '昨日購入';
    if (days < 0) return '購入予定';
    return `購入から${days}日`;
  }
  function isUrgent(days) {
    return days !== null && days <= URGENT_DAYS;
  }
  function expiryLabel(days) {
    if (days === null) return '期限なし';
    if (days < 0) return `${-days}日過ぎ`;
    if (days === 0) return '今日まで';
    if (days === 1) return '明日まで';
    return `あと${days}日`;
  }

  // ---------- 残りの量 ----------
  // 数えられるものは「数＋単位」、数えにくいものは「たっぷり／半分くらい／少し」で持つ。未入力は null
  //   { type: 'count', n: 3, unit: '個' } / { type: 'level', level: 'half' }
  const UNITS = ['個', '本', '袋', 'パック', '枚', '切れ', '玉', 'g'];
  const LEVELS = { full: 'たっぷり', half: '半分くらい', low: '少し' };
  function amountLabel(a) {
    if (!a) return '';
    if (a.type === 'count') return `残り${a.n}${a.unit}`;
    return `残り${LEVELS[a.level] || ''}`;
  }
  function amountHtml(a, label) {
    const type = !a ? '' : a.type === 'count' ? 'count' : a.level;
    const n = a && a.type === 'count' ? a.n : 1;
    const unit = a && a.type === 'count' ? a.unit : UNITS[0];
    const opt = (v, text) => `<option value="${v}"${v === type ? ' selected' : ''}>${text}</option>`;
    return `<span class="amount">
        <select class="amt-type" aria-label="${escapeHtml(label)}の残りの量">
          ${opt('', '未入力')}${opt('count', '数で入力')}${Object.entries(LEVELS).map(([k, v]) => opt(k, v)).join('')}
        </select>
        <span class="amt-count"${type === 'count' ? '' : ' hidden'}>
          <button type="button" class="step" data-step="-1" aria-label="1つ減らす">−</button>
          <input type="number" class="amt-n" min="0" step="1" inputmode="numeric" value="${escapeHtml(n)}" aria-label="${escapeHtml(label)}の個数">
          <button type="button" class="step" data-step="1" aria-label="1つ増やす">＋</button>
          <select class="amt-unit" aria-label="単位">${UNITS.map((u) => `<option${u === unit ? ' selected' : ''}>${u}</option>`).join('')}</select>
        </span>
      </span>`;
  }
  function readAmount(root) {
    const type = root.querySelector('.amt-type').value;
    if (!type) return null;
    if (type !== 'count') return { type: 'level', level: type };
    const n = Math.max(0, Math.round(Number(root.querySelector('.amt-n').value) || 0));
    return { type: 'count', n, unit: root.querySelector('.amt-unit').value };
  }
  // 種類の切り替えと −／＋ ボタン。処理したら true
  function handleAmountUi(e) {
    const box = e.target.closest('.amount');
    if (!box) return false;
    if (e.type === 'change' && e.target.matches('.amt-type')) {
      box.querySelector('.amt-count').hidden = e.target.value !== 'count';
      return true;
    }
    const step = e.type === 'click' && e.target.closest('.step');
    if (step) {
      const input = box.querySelector('.amt-n');
      input.value = Math.max(0, (Math.round(Number(input.value)) || 0) + Number(step.dataset.step));
      return true;
    }
    return e.type === 'input' || e.type === 'change';
  }
  // 購入日・賞味期限・残りの量の入力欄（登録時と在庫の編集で共通）
  function fieldsHtml(item, label) {
    return `<div class="fields">
          <label class="fld"><span class="flabel">購入日</span>
            <input type="date" class="in-bought" value="${escapeHtml(item.bought || '')}" aria-label="${escapeHtml(label)}の購入日"></label>
          <label class="fld"><span class="flabel">賞味期限</span>
            <input type="date" class="in-expiry" value="${escapeHtml(item.expiry || '')}" aria-label="${escapeHtml(label)}の賞味期限"></label>
          <div class="fld full"><span class="flabel">残り</span>${amountHtml(item.amount, label)}</div>
        </div>`;
  }
  function isEmptyCount(a) {
    return !!a && a.type === 'count' && a.n === 0;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- 食材登録 ----------
  // 検索用に表記をそろえる（全角半角・大文字小文字・カタカナ→ひらがな）
  function normalize(s) {
    return s.normalize('NFKC').toLowerCase().trim()
      .replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }
  const CATALOG_NAMES = Object.values(CATALOG).flat();
  // 入力がリストの食材名（またはよみ）とぴったり一致すれば、その食材名
  function exactCatalogName(q) {
    return CATALOG_NAMES.find((name) => normalize(name) === q || normalize(READINGS[name] || '').split(' ').includes(q));
  }
  function searchCatalog(q) {
    return CATALOG_NAMES.filter((name) =>
      normalize(name).includes(q) || normalize(READINGS[name] || '').includes(q));
  }
  function chipHtml(name) {
    return `<button type="button" class="chip" data-name="${escapeHtml(name)}" aria-pressed="${selected.has(name)}">${escapeHtml(name)}</button>`;
  }
  // 最初は食材を並べず、食材名で検索するかカテゴリのプルダウンで選んだときだけ候補を出す
  function renderCatalog() {
    // カテゴリ名の後ろに、そのカテゴリで選んでいる数を出す
    $('cat-select').innerHTML = `<option value="">📂 カテゴリ</option>` + Object.keys(CATALOG).map((cat) => {
      const n = CATALOG[cat].filter((name) => selected.has(name)).length;
      return `<option value="${escapeHtml(cat)}"${cat === activeCat ? ' selected' : ''}>${CAT_EMOJI[cat] || ''} ${escapeHtml(cat)}${n ? `（${n}）` : ''}</option>`;
    }).join('');
    $('cat-select').classList.toggle('on', !!activeCat);
    const q = normalize($('cat-search').value);
    if (q) {
      const raw = $('cat-search').value.trim().slice(0, 40);
      const hits = searchCatalog(q);
      // リストにない名前は既製品として追加できる（既製品は献立の材料に使わない）
      const productChip = exactCatalogName(q) ? ''
        : `<button type="button" class="chip product-add" data-product="${escapeHtml(raw)}">＋「${escapeHtml(raw)}」を既製品として追加</button>`;
      $('catalog').innerHTML = `<div class="chips">${hits.map(chipHtml).join('')}${productChip}</div>`;
    } else if (activeCat) {
      $('catalog').innerHTML = `<div class="chips">${CATALOG[activeCat].map(chipHtml).join('')}</div>`;
    } else {
      $('catalog').innerHTML = '';
    }
  }
  // 検索とカテゴリはどちらか一方だけ効かせる
  $('cat-search').addEventListener('input', () => {
    if ($('cat-search').value.trim()) activeCat = null;
    renderCatalog();
  });
  $('cat-select').addEventListener('change', () => {
    activeCat = $('cat-select').value || null; // 「カテゴリ」に戻すと閉じる
    $('cat-search').value = '';
    renderCatalog();
  });
  function updateSelection() {
    renderCatalog();
    $('selected-note').textContent = selected.size ? `選んだ食材 ${selected.size}件（購入日・賞味期限・残りの量は任意）` : '食材名で検索するか、カテゴリを選んでください。リストにない既製品は名前を入力して追加できます';
    $('picked').innerHTML = [...selected].map(([name, item]) => `
      <li data-name="${escapeHtml(name)}">
        <span class="name">${escapeHtml(name)}${item.product ? '<span class="kind">既製品</span>' : ''}</span>
        <button type="button" class="del" aria-label="${escapeHtml(name)}を選択から外す">×</button>
        ${fieldsHtml(item, name)}
      </li>`).join('');
    $('add-btn').hidden = selected.size === 0;
    $('add-btn').textContent = `🧺 ${selected.size}件を在庫に追加`;
  }
  // 選んだ食材ごとの賞味期限・残りの量
  function onPickedEvent(e) {
    const li = e.target.closest('li[data-name]');
    if (!li) return;
    const item = selected.get(li.dataset.name);
    if (e.type === 'click' && e.target.closest('.del')) {
      selected.delete(li.dataset.name);
      updateSelection();
      return;
    }
    if (handleAmountUi(e) || e.target.matches('input[type="date"]')) {
      item.bought = li.querySelector('.in-bought').value;
      item.expiry = li.querySelector('.in-expiry').value;
      item.amount = readAmount(li);
    }
  }
  ['input', 'change', 'click'].forEach((t) => $('picked').addEventListener(t, onPickedEvent));
  $('catalog').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    if (btn.dataset.product !== undefined) {
      const name = btn.dataset.product;
      if (name && !selected.has(name)) selected.set(name, { bought: toYmd(today()), expiry: '', amount: null, product: true });
      $('cat-search').value = '';
    } else {
      const name = btn.dataset.name;
      if (selected.has(name)) selected.delete(name); else selected.set(name, { bought: toYmd(today()), expiry: '', amount: null, product: false });
    }
    updateSelection();
  });
  $('add-btn').addEventListener('click', () => {
    for (const [name, item] of selected) {
      const s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name, bought: item.bought || null, expiry: item.expiry || null, amount: item.amount };
      if (item.product) s.product = true;
      stock.push(s);
    }
    saveStock();
    selected.clear();
    $('cat-search').value = '';
    activeCat = null;
    updateSelection();
    renderStock();
  });

  // ---------- 在庫一覧 ----------
  function sortedStock() {
    return stock
      .map((s) => ({ ...s, days: daysLeft(s.expiry) }))
      .sort((a, b) => {
        // 期限なしは最後、それ以外は期限の近い順（＝3日以内が必ず上に来る）
        // 期限なし同士は購入日の古い順（購入日なしはその後ろ）、最後に名前順
        if (a.days === null && b.days === null) {
          return (a.bought || '9999').localeCompare(b.bought || '9999') || a.name.localeCompare(b.name, 'ja');
        }
        if (a.days === null) return 1;
        if (b.days === null) return -1;
        return a.days - b.days;
      });
  }
  // 名前の下の小さな行：残りの量と購入日
  function subLabel(s) {
    const parts = [];
    if (s.amount) parts.push(amountLabel(s.amount));
    if (s.bought && s.expiry) parts.push(`${shortDate(s.bought)}購入`);
    if (!parts.length) return '';
    return `<span class="amt-label${isEmptyCount(s.amount) ? ' empty-count' : ''}">${escapeHtml(parts.join('・'))}</span>`;
  }
  // 右側の表示：賞味期限があれば期限、なければ購入からの日数
  function expiryCell(s) {
    if (s.expiry) return `${isUrgent(s.days) ? '⏰ ' : ''}${escapeHtml(expiryLabel(s.days))}<br>${escapeHtml(shortDate(s.expiry))}`;
    if (s.bought) return `${escapeHtml(boughtLabel(daysSince(s.bought)))}<br>${escapeHtml(shortDate(s.bought))}購入`;
    return escapeHtml(expiryLabel(null));
  }
  function renderStock() {
    const list = sortedStock();
    renderNav();
    $('stock-count').textContent = list.length ? `(${list.length})` : '';
    $('clear-btn').hidden = list.length === 0;
    if (!list.length) {
      $('stock-list').innerHTML = '<li class="empty" style="border:none;padding:0">🫙 まだ登録されていません</li>';
      return;
    }
    $('stock-list').innerHTML = list.map((s) => `
      <li class="${isUrgent(s.days) ? 'urgent' : ''}" data-id="${escapeHtml(s.id)}">
        <button type="button" class="item-btn" aria-label="${escapeHtml(s.name)}の購入日・賞味期限・残りの量を変更">${escapeHtml(s.name)}${s.product ? '<span class="kind">既製品</span>' : ''}${subLabel(s)}</button>
        <button type="button" class="exp-btn" aria-label="${escapeHtml(s.name)}の購入日・賞味期限・残りの量を変更">${expiryCell(s)}</button>
        <button type="button" class="del" aria-label="${escapeHtml(s.name)}を削除">×</button>
        ${s.id === editingId ? `
        <div class="edit-panel">
          ${fieldsHtml(s, s.name)}
          <div class="edit-actions">
            <button type="button" class="primary save-exp">保存</button>
            <button type="button" class="link cancel-exp">やめる</button>
          </div>
        </div>` : ''}
      </li>`).join('');
  }
  $('stock-list').addEventListener('change', handleAmountUi);
  $('stock-list').addEventListener('click', (e) => {
    if (handleAmountUi(e)) return;
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    const id = li.dataset.id;
    if (e.target.closest('.del')) {
      stock = stock.filter((s) => s.id !== id);
      saveStock();
    } else if (e.target.closest('.exp-btn, .item-btn')) {
      editingId = editingId === id ? null : id;
    } else if (e.target.closest('.save-exp')) {
      const item = stock.find((s) => s.id === id);
      if (item) {
        item.bought = li.querySelector('.in-bought').value || null;
        item.expiry = li.querySelector('.in-expiry').value || null; // 空欄で保存すると期限なし
        item.amount = readAmount(li);
        if (isEmptyCount(item.amount) && confirm(`${item.name}の残りが0になりました。在庫から削除しますか？`)) {
          stock = stock.filter((s) => s.id !== id);
        }
      }
      editingId = null;
      saveStock();
    } else if (e.target.closest('.cancel-exp')) {
      editingId = null;
    } else {
      return;
    }
    renderStock();
  });
  $('clear-btn').addEventListener('click', () => {
    if (!confirm('在庫をすべて削除しますか？')) return;
    stock = [];
    saveStock();
    renderStock();
  });

  // ---------- レシピ ----------
  async function loadRecipes() {
    try {
      const res = await fetch('recipes.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('配列ではありません');
      recipes = data.filter((r) => r && r.name && Array.isArray(r.ingredients) && r.ingredients.length);
    } catch (e) {
      recipesError = e;
    }
  }

  // 在庫の食材名 → 一番期限が近い日数（期限なしのみなら null）
  function stockIndex() {
    const idx = new Map();
    for (const s of stock) {
      if (s.product || isEmptyCount(s.amount)) continue; // 既製品と残り0のものは献立の材料に使わない
      const d = daysLeft(s.expiry);
      if (!idx.has(s.name)) { idx.set(s.name, d); continue; }
      const cur = idx.get(s.name);
      if (d !== null && (cur === null || d < cur)) idx.set(s.name, d);
    }
    return idx;
  }

  function scoreRecipe(r, idx) {
    const have = [];
    const missing = [];
    let bonus = 0;
    for (const name of r.ingredients) {
      if (idx.has(name)) {
        const d = idx.get(name);
        have.push({ name, days: d });
        // 期限が近い在庫を使うほど加点（今日・期限切れで最大 0.4）
        if (isUrgent(d)) bonus += Math.min(URGENT_DAYS + 1 - d, URGENT_DAYS + 1) * 0.1;
      } else {
        missing.push(name);
      }
    }
    const ratio = have.length / r.ingredients.length;
    return { recipe: r, have, missing, ratio, score: ratio + bonus };
  }

  function suggest() {
    const out = $('results');
    if (recipesError) {
      out.innerHTML = `<p class="notice error">recipes.json を読み込めませんでした（${escapeHtml(recipesError.message)}）。<br>ファイルを直接開いた場合は読み込めません。GitHub Pages かローカルサーバー経由で開いてください。</p>`;
      return;
    }
    if (!recipes) {
      out.innerHTML = '<p class="notice">📖 レシピを読み込み中です…</p>';
      return;
    }
    if (!stock.some((s) => !s.product)) {
      out.innerHTML = '<p class="notice">🫙 献立に使える食材が在庫にありません。<a href="#stock">在庫管理</a>で食材を登録してください。</p>';
      return;
    }
    const maxTime = Number($('time').value);
    const mood = $('mood').value;
    const idx = stockIndex();
    const ranked = recipes
      .filter((r) => !maxTime || Number(r.time) <= maxTime)
      .filter((r) => !mood || r.type === mood)
      .map((r) => scoreRecipe(r, idx))
      .filter((x) => x.have.length > 0)
      .sort((a, b) => b.score - a.score || Number(a.recipe.time) - Number(b.recipe.time))
      .slice(0, RESULT_COUNT);

    if (!ranked.length) {
      out.innerHTML = '<p class="notice">🤔 条件に合い、在庫を使えるレシピが見つかりませんでした。調理時間や気分を変えてみてください。</p>';
      return;
    }
    out.innerHTML = ranked.map(renderCard).join('') +
      (ranked.length < RESULT_COUNT ? `<p class="notice">条件に合うレシピは${ranked.length}件でした。</p>` : '');
  }

  function renderCard(x) {
    const r = x.recipe;
    const pct = Math.round(x.ratio * 100);
    const url = typeof r.url === 'string' && /^https?:\/\//i.test(r.url) ? r.url : '';
    return `
      <article class="card">
        <h4>${escapeHtml(r.name)}</h4>
        <p class="meta">⏱️ ${escapeHtml(r.time)}分 ・ ${TYPE_EMOJI[r.type] || '🍴'} ${escapeHtml(r.type || '')} ・ 在庫で${pct}%揃う${pct === 100 ? ' 🎉' : ''}</p>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="label">✅ 使える在庫</div>
        <div class="tags">${x.have.map((h) => `<span class="tag${isUrgent(h.days) ? ' urgent' : ''}">${escapeHtml(h.name)}${isUrgent(h.days) ? `（${escapeHtml(expiryLabel(h.days))}）` : ''}</span>`).join('')}</div>
        <div class="label">🛒 足りない食材</div>
        <div class="tags">${x.missing.length ? x.missing.map((m) => `<span class="tag missing">${escapeHtml(m)}</span>`).join('') : '<span class="tag">なし（全部揃っています 🎉）</span>'}</div>
        ${url ? `<a class="recipe-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">📖 レシピを見る ↗</a>` : ''}
      </article>`;
  }

  $('suggest-btn').addEventListener('click', suggest);

  // ---------- 画面切り替え（#stock = 在庫管理、#menu = 献立） ----------
  function renderNav() {
    const urgent = stock.filter((s) => isUrgent(daysLeft(s.expiry))).length;
    $('nav-stock').innerHTML = `<span class="nav-icon" aria-hidden="true">🧊</span>在庫管理${urgent ? `<span class="badge" aria-label="期限が近いもの${urgent}件">${urgent}</span>` : ''}`;
    const foods = stock.filter((s) => !s.product);
    const nearFoods = foods.filter((s) => isUrgent(daysLeft(s.expiry))).length;
    const products = stock.length - foods.length;
    $('stock-summary').textContent = `在庫の食材 ${foods.length}件` + (nearFoods ? `（うち期限が近いもの ${nearFoods}件）` : '') +
      (products ? `。既製品 ${products}件は献立に使いません` : '');
  }
  function showScreen() {
    const screen = location.hash === '#menu' ? 'menu' : location.hash === '#stock' ? 'stock' : (stock.some((s) => !s.product) ? 'menu' : 'stock');
    $('screen-stock').hidden = screen !== 'stock';
    $('screen-menu').hidden = screen !== 'menu';
    $('nav-stock').removeAttribute('aria-current');
    $('nav-menu').removeAttribute('aria-current');
    $(`nav-${screen}`).setAttribute('aria-current', 'page');
    if (screen === 'menu' && $('results').innerHTML.trim()) suggest(); // 在庫が変わっていても最新の在庫で出し直す
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', showScreen);

  updateSelection();
  renderStock();
  showScreen();
  loadRecipes();
})();
</script>
</body>
</html>
